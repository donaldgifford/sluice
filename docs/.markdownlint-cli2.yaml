---
# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/main/schema/markdownlint-cli2-config-schema.json
# Overrides for docz-managed documents. markdownlint-cli2 merges this with
# the root .markdownlint-cli2.yaml per rule — every rule not listed here
# inherits the root configuration.
config:
  # Link fragments (TOC anchors).
  # The <!--toc:start--> blocks are generated by docz, whose slugger diverges
  # from GitHub's for headings containing "/" or "—": GitHub drops the
  # punctuation but keeps both surrounding spaces as hyphens
  # ("API / Interface Changes" -> #api--interface-changes), while docz emits
  # a single hyphen (#api-interface-changes). Hand-fixing the links would be
  # overwritten by the next `docz update`, so the rule is disabled here until
  # docz's slug generation matches GitHub's. Scoped to docs/ on purpose —
  # everywhere else broken anchors should still fail.
  MD051: false

  # Duplicate headings.
  # The docz IMPL template intentionally repeats "Tasks" and "Success
  # Criteria" under every phase heading. siblings_only allows repeats under
  # different parents while still flagging true duplicates at the same level.
  MD024:
    siblings_only: true
