---
# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/main/schema/markdownlint-cli2-config-schema.json
# Single markdownlint config: runner options + rule configuration.
# Scoped overrides for docz-managed documents live in
# docs/.markdownlint-cli2.yaml — markdownlint-cli2 merges nested option
# files per rule, closest file winning, so that file lists only the rules
# it changes.
#
# CHANGELOG.md is generated by git-cliff and verified byte-for-byte by the
# changelog drift check, so it can never be hand-edited to satisfy a linter.
# git-cliff's output legitimately repeats section headings across releases
# (MD024) and starts each release block flush against the previous line
# (MD022). Generated output is verified by regeneration, not linted —
# same reasoning as the CHANGELOG.md entry in .prettierignore.
ignores:
  - CHANGELOG.md
  # Machine-managed Claude Code session state (gitignored), not prose.
  - ".claude/**"

# https://github.com/DavidAnson/markdownlint
config:
  # Unordered list style
  # Disabled this because the TOC was giving me warnings for using other
  # symbols than -
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md004.md
  MD004: false

  # Unordered list indentation
  # I disable this because for some documents I use 4 space indenting, like
  # markdown files that I need to upload to confluence
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md007.md
  MD007: false

  # Hard tabs
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md010.md
  # This rule is triggered by any lines that contain hard tab characters
  # instead of using spaces for indentation. To fix this, replace any hard
  # tab characters with spaces instead
  MD010:
    code_blocks: false

  # Multiple consecutive blank lines
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md012.md
  # Not sure why at the end of markdown files I get an error that there are 2
  # blank lines when there's only 1, so increasing this to fix it
  MD012:
    maximum: 2

  # Line length
  # I disabled this because autoformatting takes care of the line length for
  # me, so it's not necessary, also if I have a really long markdown link
  # with {:target="\_blank"} at the end, it will trigger it, and haven't
  # looked into how to fix that
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md013.md
  MD013: false

  # Spaces after list markers
  # Disabled this because of confluence formatting
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md030.md
  MD030: false

  # Inline HTML
  # I disabled this so it doesn't warn me when I include HTML code in my
  # markdown files, sometimes HTML is needed in github readmes
  # https://github.com/DavidAnson/markdownlint/blob/main/doc/md033.md
  MD033: false
